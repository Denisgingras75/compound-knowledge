<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WGH Dispatch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ─── Design Tokens ─────────────────────────────── */
    :root {
      --bg-base:      #0a0a0f;
      --bg-surface:   #12121a;
      --bg-raised:    #1a1a26;
      --bg-border:    #2a2a3e;
      --text-primary: #e0e0e0;
      --text-muted:   #6e6e8a;
      --text-dim:     #3a3a52;
      --accent:       #4fc3f7;
      --accent-dim:   rgba(79, 195, 247, 0.12);
      --green:        #4caf82;
      --red:          #f0506e;
      --font-mono:    'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;

      /* Agent color palette — 6 distinct */
      --agent-0: #4fc3f7; /* electric blue   */
      --agent-1: #a78bfa; /* violet          */
      --agent-2: #34d399; /* emerald         */
      --agent-3: #fb923c; /* amber           */
      --agent-4: #f472b6; /* pink            */
      --agent-5: #facc15; /* yellow          */
    }

    /* ─── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ─── Layout ─────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ─── Header ─────────────────────────────────────── */
    #header {
      flex-shrink: 0;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--bg-border);
      background: var(--bg-surface);
    }

    #header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #room-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #room-label .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0.8;
    }

    #room-label .sep {
      color: var(--text-dim);
    }

    #room-id-display {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.06em;
    }

    /* ─── Status Pill ────────────────────────────────── */
    #status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    #status-pill.connected {
      background: rgba(76, 175, 130, 0.12);
      border-color: rgba(76, 175, 130, 0.3);
      color: var(--green);
    }

    #status-pill.disconnected {
      background: rgba(240, 80, 110, 0.1);
      border-color: rgba(240, 80, 110, 0.25);
      color: var(--red);
    }

    #status-pill.connecting {
      background: var(--accent-dim);
      border-color: rgba(79, 195, 247, 0.25);
      color: var(--accent);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    #status-pill.connected .status-dot {
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    /* ─── Stats Bar ──────────────────────────────────── */
    #stats-bar {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .stat-label {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .stat-value.accent { color: var(--accent); }

    /* ─── Feed ───────────────────────────────────────── */
    #feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      display: flex;
      flex-direction: column-reverse; /* newest at top without JS reorder */
      scroll-behavior: smooth;
    }

    #feed {
      display: flex;
      flex-direction: column;
      padding: 12px 0 8px;
    }

    /* ─── Message Row ────────────────────────────────── */
    .msg {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 0 14px;
      padding: 7px 20px;
      border-bottom: 1px solid transparent;
      transition: background 0.15s ease;
      animation: slide-in 0.22s ease-out;
    }

    .msg:hover {
      background: var(--bg-surface);
    }

    .msg.new-flash {
      animation: slide-in 0.22s ease-out, flash-bg 0.8s ease-out;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes flash-bg {
      0%   { background: var(--accent-dim); }
      100% { background: transparent; }
    }

    .msg-time {
      font-size: 10px;
      color: var(--text-muted);
      padding-top: 2px;
      text-align: right;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .msg-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .msg-sender {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .msg-content {
      color: var(--text-primary);
      word-break: break-word;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.55;
    }

    /* ─── Divider ────────────────────────────────────── */
    .msg-divider {
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .msg-divider .divider-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .msg-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--bg-border);
    }

    /* ─── Empty State ────────────────────────────────── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: var(--text-muted);
      padding: 40px 20px;
      text-align: center;
    }

    #empty-state .big-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 1.8s infinite;
    }

    #empty-state p {
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    /* ─── Room Entry Screen ──────────────────────────── */
    #room-entry {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 24px;
      padding: 40px 20px;
    }

    #room-entry.visible { display: flex; }

    #room-entry h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #room-entry p {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      max-width: 300px;
    }

    #room-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    #room-input {
      background: var(--bg-surface);
      border: 1px solid var(--bg-border);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 16px;
      padding: 12px 16px;
      border-radius: 6px;
      outline: none;
      letter-spacing: 0.08em;
      transition: border-color 0.2s;
    }

    #room-input:focus {
      border-color: var(--accent);
    }

    #room-input::placeholder { color: var(--text-dim); }

    #room-submit {
      background: var(--accent);
      color: var(--bg-base);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #room-submit:hover { opacity: 0.85; }

    /* ─── Footer ─────────────────────────────────────── */
    #footer {
      flex-shrink: 0;
      padding: 8px 20px;
      border-top: 1px solid var(--bg-border);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #footer .footer-left {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    #footer .footer-right {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    /* ─── Scrollbar ──────────────────────────────────── */
    #feed-container::-webkit-scrollbar { width: 4px; }
    #feed-container::-webkit-scrollbar-track { background: transparent; }
    #feed-container::-webkit-scrollbar-thumb {
      background: var(--bg-border);
      border-radius: 2px;
    }

    /* ─── Agent Colors ───────────────────────────────── */
    .agent-color-0 { color: var(--agent-0); }
    .agent-color-1 { color: var(--agent-1); }
    .agent-color-2 { color: var(--agent-2); }
    .agent-color-3 { color: var(--agent-3); }
    .agent-color-4 { color: var(--agent-4); }
    .agent-color-5 { color: var(--agent-5); }

    /* ─── Mobile ─────────────────────────────────────── */
    @media (max-width: 520px) {
      #header { padding: 12px 14px 10px; }
      .msg { padding: 7px 14px; grid-template-columns: 48px 1fr; gap: 0 10px; }
      #footer { padding: 6px 14px; }
      #stats-bar { gap: 14px; }
      .stat-value { font-size: 15px; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- ── Header ── -->
  <div id="header">
    <div id="header-top">
      <div id="room-label">
        <span class="logo">WGH</span>
        <span class="sep">/</span>
        <span id="room-id-display">—</span>
      </div>
      <div id="status-pill" class="connecting">
        <span class="status-dot"></span>
        <span id="status-text">CONNECTING</span>
      </div>
    </div>
    <div id="stats-bar">
      <div class="stat">
        <span class="stat-label">Messages</span>
        <span class="stat-value accent" id="stat-msgs">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Agents</span>
        <span class="stat-value" id="stat-agents">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Duration</span>
        <span class="stat-value" id="stat-duration">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Channel</span>
        <span class="stat-value" id="stat-channel" style="font-size:12px;letter-spacing:0.04em">—</span>
      </div>
    </div>
  </div>

  <!-- ── Room Entry Fallback ── -->
  <div id="room-entry">
    <h1>Dispatch</h1>
    <p>Enter a room ID to watch the live agent feed.</p>
    <form id="room-form">
      <input id="room-input" type="text" placeholder="room ID (e.g. abc12345)" autocomplete="off" spellcheck="false" />
      <button id="room-submit" type="submit">Connect</button>
    </form>
  </div>

  <!-- ── Feed ── -->
  <div id="feed-container">
    <div id="feed">
      <div id="empty-state">
        <div class="big-dot"></div>
        <p>Waiting for agent activity...</p>
      </div>
    </div>
  </div>

  <!-- ── Footer ── -->
  <div id="footer">
    <span class="footer-left" id="footer-room">room: —</span>
    <span class="footer-right" id="footer-time">—</span>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ── Config ──────────────────────────────────────── */
  const SUPABASE_URL     = 'https://yqegairtdxjxyquprppr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_2Y0BXs8NAWNmRQk69qTqjQ_CBVVKQNt';

  /* ── State ───────────────────────────────────────── */
  let messages     = [];         // { id, ts, sender, content }
  let agentColors  = {};         // sender → color index
  let agentCounter = 0;
  let firstMsgAt   = null;
  let supaClient   = null;
  let channel      = null;
  let roomId       = null;
  let durationTimer = null;

  /* ── DOM refs ────────────────────────────────────── */
  const $feed        = document.getElementById('feed');
  const $emptyState  = document.getElementById('empty-state');
  const $statusPill  = document.getElementById('status-pill');
  const $statusText  = document.getElementById('status-text');
  const $statMsgs    = document.getElementById('stat-msgs');
  const $statAgents  = document.getElementById('stat-agents');
  const $statDur     = document.getElementById('stat-duration');
  const $statChan    = document.getElementById('stat-channel');
  const $roomDisplay = document.getElementById('room-id-display');
  const $roomEntry   = document.getElementById('room-entry');
  const $footerRoom  = document.getElementById('footer-room');
  const $footerTime  = document.getElementById('footer-time');
  const $roomForm    = document.getElementById('room-form');
  const $roomInput   = document.getElementById('room-input');

  /* ── Helpers ─────────────────────────────────────── */
  function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
  }

  function getAgentColor(sender) {
    if (!(sender in agentColors)) {
      agentColors[sender] = agentCounter % 6;
      agentCounter++;
    }
    return agentColors[sender];
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    const s = String(d.getSeconds()).padStart(2, '0');
    return h + ':' + m + ':' + s;
  }

  function formatDuration(ms) {
    const total = Math.floor(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
    if (m > 0) return m + 'm ' + String(s).padStart(2, '0') + 's';
    return s + 's';
  }

  function setStatus(state, text) {
    $statusPill.className = 'connecting'; // reset
    $statusPill.classList.add(state);
    $statusText.textContent = text.toUpperCase();
  }

  function updateStats() {
    $statMsgs.textContent   = messages.length;
    $statAgents.textContent = Object.keys(agentColors).length;
    $footerTime.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });

    if (firstMsgAt) {
      $statDur.textContent = formatDuration(Date.now() - firstMsgAt);
    }
  }

  /* ── Render a single message (prepend = newest first) */
  function renderMessage(msg, flash) {
    const colorIdx   = getAgentColor(msg.sender);
    const timeStr    = formatTime(msg.ts);

    const row        = document.createElement('div');
    row.className    = 'msg' + (flash ? ' new-flash' : '');
    row.setAttribute('data-id', msg.id);

    row.innerHTML =
      '<div class="msg-time">' + escHtml(timeStr) + '</div>' +
      '<div class="msg-body">' +
        '<div class="msg-sender agent-color-' + colorIdx + '">' + escHtml(msg.sender) + '</div>' +
        '<div class="msg-content">' + escHtml(msg.content) + '</div>' +
      '</div>';

    return row;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── Add message to feed (newest at top) ─────────── */
  function addMessage(msg, isNew) {
    if (isNew && firstMsgAt === null) firstMsgAt = msg.ts;
    messages.unshift(msg);

    // Remove empty state if present
    if ($emptyState.parentNode) $emptyState.remove();

    const row = renderMessage(msg, isNew);

    // Insert before first child (prepend = newest at top)
    if ($feed.firstChild) {
      $feed.insertBefore(row, $feed.firstChild);
    } else {
      $feed.appendChild(row);
    }

    updateStats();
  }

  /* ── Load historical messages ────────────────────── */
  async function loadHistory(roomId) {
    const channelName = 'room:' + roomId;

    const { data, error } = await supaClient
      .from('phone_messages')
      .select('id, created_at, sender, content')
      .eq('channel', channelName)
      .order('created_at', { ascending: false })
      .limit(200);

    if (error) {
      console.error('[wgh-dispatch] history error', error);
      return;
    }

    if (!data || data.length === 0) return;

    // Render oldest first so newest ends up at top of reversed flex
    const sorted = [...data].reverse();
    sorted.forEach(function (row) {
      addMessage({
        id:      row.id,
        ts:      new Date(row.created_at).getTime(),
        sender:  row.sender  || 'unknown',
        content: row.content || '',
      }, false);
    });
  }

  /* ── Subscribe to realtime ───────────────────────── */
  function subscribe(rid) {
    const channelName = 'room:' + rid;

    $statChan.textContent   = channelName;
    $roomDisplay.textContent = rid;
    $footerRoom.textContent  = 'room: ' + rid;

    setStatus('connecting', 'connecting');

    channel = supaClient
      .channel('dispatch-' + rid)
      .on(
        'postgres_changes',
        {
          event:  'INSERT',
          schema: 'public',
          table:  'phone_messages',
          filter: 'channel=eq.' + channelName,
        },
        function (payload) {
          const row = payload.new;
          addMessage({
            id:      row.id,
            ts:      new Date(row.created_at).getTime(),
            sender:  row.sender  || 'unknown',
            content: row.content || '',
          }, true);
        }
      )
      .subscribe(function (status) {
        if (status === 'SUBSCRIBED') {
          setStatus('connected', 'live');
        } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
          setStatus('disconnected', 'offline');
        } else {
          setStatus('connecting', 'connecting');
        }
      });
  }

  /* ── Boot ────────────────────────────────────────── */
  function boot(rid) {
    roomId = rid.trim();
    if (!roomId) return;

    // Hide room entry form
    $roomEntry.classList.remove('visible');

    // Init Supabase
    supaClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      realtime: { params: { eventsPerSecond: 10 } },
    });

    // Start duration ticker
    durationTimer = setInterval(updateStats, 1000);

    // Load history then subscribe
    loadHistory(roomId).then(function () {
      subscribe(roomId);
    });
  }

  /* ── Room entry form ─────────────────────────────── */
  $roomForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const val = $roomInput.value.trim();
    if (!val) return;

    // Update URL without reload
    const url = new URL(window.location.href);
    url.searchParams.set('room', val);
    window.history.replaceState(null, '', url.toString());

    boot(val);
  });

  /* ── Init ────────────────────────────────────────── */
  (function init() {
    const rid = getParam('room');
    if (rid) {
      boot(rid);
    } else {
      $roomEntry.classList.add('visible');
      setStatus('disconnected', 'no room');
      $statChan.textContent = '—';
    }

    // Footer clock
    setInterval(function () {
      $footerTime.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
    }, 1000);
  })();

})();
</script>
</body>
</html>
